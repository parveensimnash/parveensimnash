name: Refresh profile cards

on:
  schedule:
    - cron: "30 0 * * *"   # daily 06:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render card from all repos (needs LANGS_PAT secret with repo scope)
        env:
          GITHUB_TOKEN: ${{ secrets.LANGS_PAT }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::warning::LANGS_PAT secret not set; skipping refresh"; exit 0
          fi
          python3 scripts/langs_card.py "${{ github.repository_owner }}"
          python3 scripts/stats_cards.py "${{ github.repository_owner }}"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile cards" && git push
